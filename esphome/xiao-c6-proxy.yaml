# Shared package: credentials belong in the local device YAML, not here.
substitutions:
  device_name: lights-bluetooth-proxy
  friendly_name: Lights Bluetooth Proxy

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:

esp32_ble_tracker:

bluetooth_proxy:
  active: true

# XIAO C6 RF switch: GPIO3 LOW enables switching; GPIO14 HIGH selects U.FL.
switch:
  - platform: gpio
    id: antenna_switch_power
    pin: GPIO3
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: gpio
    id: external_antenna_select
    pin: GPIO14
    restore_mode: ALWAYS_ON
    internal: true
